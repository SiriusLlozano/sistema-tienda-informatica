spring.application.name=tienda_computadoras

# Base de datos H2 en memoria para desarrollo
spring.datasource.url=jdbc:h2:mem:tiendadb
spring.datasource.username=usuario
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

app.security.admin.username=${APP_ADMIN_USERNAME}
app.security.admin.password=${APP_ADMIN_PASSWORD}
app.security.vendedor.username=${APP_VENDEDOR_USERNAME}
app.security.vendedor.password=${APP_VENDEDOR_PASSWORD}
